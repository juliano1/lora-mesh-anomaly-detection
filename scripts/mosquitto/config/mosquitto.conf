# Broker MQTT local para o laboratório (Mosquitto 2).
# Sem acesso anônimo: crie o arquivo de senhas antes de subir o contêiner
# (instruções em scripts/mosquitto/config/acl.example e no README).
# O tráfego é MQTT sem TLS: use apenas em rede de laboratório isolada.

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl

# Limita o pacote MQTT: o uplink do gateway tem menos de 1 KiB e o backend recusa
# payloads acima de 8192 bytes; a folga cobre cabeçalho e tópico.
max_packet_size 9216

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
