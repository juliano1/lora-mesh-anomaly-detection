[platformio]
build_dir = .pio/build
libdeps_dir = .pio/libdeps

;******************************************************************************
; Configuração do PlatformIO - LoRaMesher Laboratory
; Hardware: Heltec WiFi LoRa 32 V2 (ESP32 + SX1276)
;
; Ambientes da mesma placa:
;   heltec_v2          — nó mesh; ajuste NODE_ID por dispositivo
;   heltec_v2_gateway  — gateway WiFi/MQTT; requer credentials.h local
;******************************************************************************

; ── Defaults compartilhados ─────────────────────────────────────────────────
[env]
framework          = arduino
monitor_speed      = 115200
monitor_filters    = esp32_exception_decoder
; Dependências comuns — versões fixadas para reprodutibilidade
lib_deps =
    jgromes/RadioLib@7.7.1
    https://github.com/LoRaMesher/LoRaMesher.git#d37dee7b69866dd052d342174e2e441bd356f068
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@6.21.6
    olikraus/U8g2@2.36.18
extra_scripts      = pre:apply_patch.py
board_build.filesystem = littlefs
; Flags comuns
build_flags =
    -D NETWORK_ID=1           ; ID da rede (tópicos MQTT e ACL do broker)
    -D LM_MAX_PACKET_SIZE=230 ; pacote LoRaMesher; payload útil de 221 bytes (cabeçalho de 9)
    -D CORE_DEBUG_LEVEL=3     ; 0=None 3=Info 5=Verbose

; ── Heltec WiFi LoRa 32 V2  (ESP32 + SX1276) ───────────────────────────────
[env:heltec_v2]
platform  = espressif32@6.5.0
board     = heltec_wifi_lora_32_V2
build_flags =
    ${env.build_flags}
    -D HELTEC_V2
    -D NODE_ID=2              ; Defina um ID único para cada nó
; ── LoRa AU915 — opcional, sobrescreve padrão de hal_conf.h ──────
; Padrão: SB2 offset 0 → canal 8 → 903.9 MHz (ver README sobre a regulamentação)
; Para uma segunda rede no mesmo local, use sub-banda diferente, ex.:
;   -D LORA_AU915_SUBBAND=3 -D LORA_AU915_CHANNEL_IN_SB=0  → 905.5 MHz
;   -D LORA_AU915_SUBBAND=4 -D LORA_AU915_CHANNEL_IN_SB=0  → 907.1 MHz
; TODOS os nós da mesma rede DEVEM usar a mesma sub-banda/canal.
upload_speed = 57600
upload_flags =
    --no-stub

; Gateway da mesma placa; credenciais ficam no arquivo local ignorado pelo Git.
[env:heltec_v2_gateway]
extends = env:heltec_v2
build_flags =
    ${env.build_flags}
    -D HELTEC_V2
    -D NODE_ID=1
    -D IS_GATEWAY
